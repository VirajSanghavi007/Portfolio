name: Daily GitHub/Codeforces/LeetCode Sync

on:
  schedule:
    # 03:00 UTC daily (08:30 IST)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run GitHub sync
        run: python scripts/github_sync.py

      - name: Run Codeforces sync
        run: python scripts/codeforces_sync.py

      - name: Run LeetCode sync
        run: python scripts/leetcode_sync.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Auto-sync GitHub/Codeforces/LeetCode stats"
            git push
          else
            echo "No stat changes, nothing to commit."
          fi
